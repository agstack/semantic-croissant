[package]
name = "md-viewer-wasm"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.33"
egui_commonmark_extended = { version = "0.28.3", features = ["better_syntax_highlighting", "svg", "fetch"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1.6"

[patch.crates-io]
egui_commonmark_extended = { path = "crates/egui_commonmark/egui_commonmark", version = "0.28.3" }
egui_commonmark_backend_extended = { path = "crates/egui_commonmark/egui_commonmark_backend", version = "0.28.3" }
